<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Alpha Farm{% endblock %}</title>
<style>
:root { --bg:#f6f7f9; --card:#ffffff; --text:#1c2330; --muted:#657083; --line:#dde1e8; --accent:#2a6fdb; --warn:#b26a00; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12161c; --card:#1b212b; --text:#e6e9ee; --muted:#9aa4b2; --line:#2b3340; --accent:#6aa0f5; --warn:#e0a040; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display:flex; min-height:100vh; }
aside { width:210px; flex:none; background:var(--card); border-right:1px solid var(--line); padding:16px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
aside .brand { font-weight:700; margin:0 8px 12px; }
aside a.nav { color:var(--muted); text-decoration:none; padding:8px 10px; border-radius:6px; transition:background .2s, color .2s; }
aside a.nav:hover { background:var(--bg); }
aside a.nav.on { color:#fff; background:var(--accent); }
aside .navhead { margin:14px 10px 2px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
figure, .tablebox { margin:0 0 20px; }
figcaption, caption { font-size:13px; color:var(--text); text-align:left; margin:6px 0; caption-side:top; }
caption b, figcaption b { font-weight:700; }
.reading { color:var(--muted); }
.pending { border-left:4px solid var(--warn); } .primary { border-left:4px solid var(--accent); }
.role { display:inline-block; font-size:11px; padding:0 7px; border-radius:9px; border:1px solid var(--line); margin-left:6px; vertical-align:middle; font-weight:600; }
.role-chính { background:var(--accent); color:#fff; border-color:var(--accent); } .role-phụ { color:var(--muted); } .role-chẩn-đoán { color:var(--warn); border-color:var(--warn); }
th[title] { cursor:help; text-decoration:underline dotted; } ul.metrics { padding-left:20px; }
#strip { margin-top:auto; font-size:12px; color:var(--muted); display:grid; gap:6px; }
#strip .row { display:flex; justify-content:space-between; } #strip .row b { color:var(--text); font-weight:600; }
main { flex:1; min-width:0; max-width:1150px; margin:0 auto; padding:20px; animation:fadein .35s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@media (max-width:760px) { body { display:block; } aside { width:auto; height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center; } aside .brand { display:none; } #strip { margin:0 0 0 auto; width:100%; } }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; transition:transform .2s, box-shadow .2s; }
.stat:hover { transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.12); }
.stat .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--bg); border:1px solid var(--line); }
.chip.hit { border-color:var(--accent); color:var(--accent); }
.panels { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
.chartbox { position:relative; height:300px; } .chartbox.tall { height:340px; }
.pulse { animation:pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.55; } }
h1 { font-size:22px; margin:8px 0 12px; } h2 { font-size:18px; margin:0 0 8px; } h3 { font-size:15px; margin:16px 0 6px; }
a { color:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin:0 0 16px; }
.muted { color:var(--muted); } .small { font-size:13px; }
.badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:var(--accent); color:#fff; margin-left:6px; }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
th:first-child, td:first-child, td.left, th.left { text-align:left; }
td.expr { white-space:normal; word-break:break-word; text-align:left; font-family:ui-monospace, Consolas, monospace; font-size:12px; min-width:220px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
details { margin:8px 0; } summary { cursor:pointer; color:var(--accent); }
code { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-word; }
form.pick { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin:8px 0; }
form.pick label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); }
select, button { font:inherit; padding:4px 8px; }
.bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; } .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .6s ease; }
.cores { display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; }
</style>
</head>
<body>
<aside>
  <div class="brand">Alpha Farm</div>
  <a class="nav {% if active == 'overview' %}on{% endif %}" href="/">Tổng quan</a>
  <a class="nav {% if active == 'data' %}on{% endif %}" href="/data">Dữ liệu</a>
  <a class="nav {% if active == 'method' %}on{% endif %}" href="/method">Phương pháp</a>
  <div class="navhead">Kết quả</div>
  <a class="nav {% if active == 'planted' %}on{% endif %}" href="/results/planted">Bài cài tín hiệu (RQ2)</a>
  <a class="nav {% if active == 'placebo' %}on{% endif %}" href="/results/placebo">Placebo (RQ2)</a>
  <a class="nav {% if active == 'rq1' %}on{% endif %}" href="/results/rq1">Vai trò của LLM (RQ1)</a>
  <a class="nav {% if active == 'walkforward' %}on{% endif %}" href="/results/walkforward">Chuỗi ngoài mẫu</a>
  <a class="nav {% if active == 'thesis' %}on{% endif %}" href="/thesis">Luận văn</a>
  <a class="nav {% if active == 'guide' %}on{% endif %}" href="/guide">Hướng dẫn LVTN</a>
  <div class="navhead">Công cụ (ngoài luận văn)</div>
  <a class="nav {% if active == 'system' %}on{% endif %}" href="/system">Tài nguyên máy</a>
  <div id="strip">
    <div class="row"><span>CPU</span><b id="s-cpu">–</b></div><div class="bar" id="s-cpu-bar"><i></i></div>
    <div class="row"><span>RAM</span><b id="s-ram">–</b></div><div class="bar" id="s-ram-bar"><i></i></div>
    <div class="row"><span>GPU</span><b id="s-gpu">–</b></div><div class="bar" id="s-gpu-bar"><i></i></div>
  </div>
</aside>
<main>
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
function text(id, value) { var el = document.getElementById(id); if (el) { el.textContent = value; } }
function pct(v) { return v === null || v === undefined ? '–' : Math.round(v) + '%'; }
function gb(mb) { return (mb / 1024).toFixed(1); }
function bar(id, value) { var el = document.getElementById(id); if (el) { el.firstElementChild.style.width = Math.min(100, Math.max(0, value)) + '%'; } }
function render(d) {
  text('s-cpu', pct(d.cpu_percent)); bar('s-cpu-bar', d.cpu_percent);
  text('s-ram', pct(d.ram.percent)); bar('s-ram-bar', d.ram.percent);
  text('s-gpu', d.gpu ? pct(d.gpu.util_percent) + ' · ' + gb(d.gpu.vram_used_mb) + '/' + gb(d.gpu.vram_total_mb) + ' GB' : 'không đọc được');
  if (d.gpu) { bar('s-gpu-bar', d.gpu.util_percent); }
  text('cpu-total', pct(d.cpu_percent)); bar('cpu-total-bar', d.cpu_percent);
  text('ram-text', pct(d.ram.percent) + ' (' + gb(d.ram.used_mb) + ' / ' + gb(d.ram.total_mb) + ' GB)'); bar('ram-bar', d.ram.percent);
  if (d.gpu) {
    text('gpu-text', pct(d.gpu.util_percent)); bar('gpu-bar', d.gpu.util_percent);
    text('vram-text', gb(d.gpu.vram_used_mb) + ' / ' + gb(d.gpu.vram_total_mb) + ' GB'); bar('vram-bar', 100 * d.gpu.vram_used_mb / d.gpu.vram_total_mb);
  } else {
    text('gpu-text', 'không đọc được' + (d.gpu_error ? ' (' + d.gpu_error + ')' : '')); text('vram-text', 'không đọc được');
  }
  text('disk-text', d.disk.free_gb.toFixed(1) + ' GB trống / ' + d.disk.total_gb.toFixed(1) + ' GB (' + d.disk.path + ')'); bar('disk-bar', d.disk.percent);
  var cores = document.getElementById('cores');
  if (cores) {
    cores.textContent = '';
    d.cpu_per_core.forEach(function (v, i) {
      var cell = document.createElement('div');
      var label = document.createElement('div'); label.className = 'small muted'; label.textContent = 'nhân ' + i + ': ' + pct(v);
      var track = document.createElement('div'); track.className = 'bar';
      var fill = document.createElement('i'); fill.style.width = Math.min(100, v) + '%'; track.appendChild(fill);
      cell.appendChild(label); cell.appendChild(track); cores.appendChild(cell);
    });
  }
}
function poll() {
  fetch('/api/system', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(render)
    .catch(function () { text('s-cpu', 'lỗi'); });
}
poll(); setInterval(poll, 5000);
var COLORS = ['#2a6fdb', '#e8833a', '#2a9d6f', '#8a4fc7', '#c0392b', '#7f8c8d', '#c2a000', '#17a2b8'];
// points: [x, rate, low, high]; the interval is drawn as a dashed band.
function intervalChart(canvasId, points, xTitle, yTitle) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') { return; }
  var pick = function (i) { return points.map(function (p) { return { x: p[0], y: p[i] }; }); };
  new Chart(el, { type: 'line', data: { datasets: [
      { label: 'tỷ lệ tìm lại gần', data: pick(1), borderColor: COLORS[0], backgroundColor: COLORS[0], pointRadius: 5 },
      { label: 'cận dưới Wilson 95%', data: pick(2), borderColor: COLORS[1], borderDash: [4, 4], borderWidth: 1, pointRadius: 2 },
      { label: 'cận trên Wilson 95%', data: pick(3), borderColor: COLORS[1], borderDash: [4, 4], borderWidth: 1, pointRadius: 2 }] },
    options: { maintainAspectRatio: false, parsing: false, scales: {
      x: { type: 'linear', title: { display: true, text: xTitle } },
      y: { min: 0, max: 1, title: { display: true, text: yTitle } } } } });
}
// series: {configuration: [[budget, rate, low, high]]}; the band is the Wilson interval, the dashed vertical line
// marks the end of phase A (before the feedback round).
var budgetMark = { id: 'budgetMark', afterDatasetsDraw: function (chart, args, opts) {
  if (!opts || opts.value === undefined) { return; }
  var x = chart.scales.x.getPixelForValue(opts.value); var area = chart.chartArea; var ctx = chart.ctx;
  ctx.save(); ctx.strokeStyle = '#c0392b'; ctx.setLineDash([5, 4]); ctx.beginPath();
  ctx.moveTo(x, area.top); ctx.lineTo(x, area.bottom); ctx.stroke(); ctx.fillStyle = '#c0392b';
  ctx.fillText(opts.label, Math.min(x + 4, area.right - 190), area.top + 12); ctx.restore(); } };
function budgetChart(canvasId, title, series, mark, labels) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') { return; }
  var datasets = [];
  Object.keys(series).forEach(function (name, i) {
    var color = COLORS[i % COLORS.length];
    var pick = function (k) { return series[name].map(function (p) { return { x: p[0], y: p[k] }; }); };
    datasets.push({ label: (labels[name] || name) + ' cận dưới', data: pick(2), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, hideLegend: true });
    datasets.push({ label: (labels[name] || name) + ' cận trên', data: pick(3), borderColor: 'transparent', backgroundColor: color + '33', pointRadius: 0, fill: '-1', hideLegend: true });
    datasets.push({ label: labels[name] || name, data: pick(1), borderColor: color, backgroundColor: color, pointRadius: 4 });
  });
  new Chart(el, { type: 'line', plugins: [budgetMark], data: { datasets: datasets },
    options: { maintainAspectRatio: false, parsing: false, scales: {
      x: { type: 'linear', title: { display: true, text: 'ngân sách (vòng MCTS)' } },
      y: { min: 0, max: 1, title: { display: true, text: 'tỷ lệ tìm lại gần' } } },
      plugins: { title: { display: true, text: title },
        legend: { labels: { filter: function (item, data) { return !data.datasets[item.datasetIndex].hideLegend; } } },
        budgetMark: { value: mark, label: mark.toLocaleString('vi-VN') + ': hết giai đoạn A, trước phản hồi' } } } });
}
// points: [{x, y, top5}] drawn as dots, split in two colours by top5; `line` is a horizontal reference value.
function dotChart(canvasId, points, line, xTitle, yTitle, lineLabel) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') { return; }
  var xs = points.map(function (p) { return p.x; });
  var lo = Math.min.apply(null, xs.concat([0])), hi = Math.max.apply(null, xs.concat([0.1]));
  new Chart(el, { type: 'scatter', data: { datasets: [
      { label: 'ứng viên nằm trong top-5', data: points.filter(function (p) { return p.top5; }), backgroundColor: COLORS[1], pointRadius: 6 },
      { label: 'ứng viên không vào top-5', data: points.filter(function (p) { return !p.top5; }), backgroundColor: COLORS[0], pointRadius: 5 },
      { label: lineLabel, type: 'line', data: [{ x: lo, y: line }, { x: hi, y: line }], borderColor: COLORS[4],
        borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 }] },
    options: { maintainAspectRatio: false, parsing: false, scales: {
      x: { type: 'linear', title: { display: true, text: xTitle } },
      y: { min: 0, max: 1, title: { display: true, text: yTitle } } } } });
}
// points: [[set, Sharpe]] as dots; `max` and `real` (nullable) are drawn as horizontal reference lines.
function placeboChart(canvasId, d, xTitle, yTitle) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') { return; }
  var xs = d.points.map(function (p) { return p[0]; });
  var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
  var line = function (label, y, color) { return { label: label, type: 'line', data: [{ x: lo, y: y }, { x: hi, y: y }],
      borderColor: color, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 }; };
  var sets = [{ label: 'bộ placebo', data: d.points.map(function (p) { return { x: p[0], y: p[1] }; }),
      backgroundColor: COLORS[0], pointRadius: 5 }, line('Sharpe placebo lớn nhất', d.max, COLORS[1])];
  if (d.real !== null) { sets.push(line('lần chạy thật (seed 1)', d.real, COLORS[4])); }
  new Chart(el, { type: 'scatter', data: { datasets: sets }, options: { maintainAspectRatio: false, parsing: false, scales: {
    x: { type: 'linear', title: { display: true, text: xTitle } }, y: { title: { display: true, text: yTitle } } } } });
}
var markerPlugin = { id: 'markers', afterDatasetsDraw: function (chart, args, opts) {
  var m = (chart.options.plugins.markers || {}).list || []; var ctx = chart.ctx; var area = chart.chartArea;
  m.forEach(function (mk, i) {
    var x = chart.scales.x.getPixelForValue(mk.index); ctx.save(); ctx.strokeStyle = i ? '#2a9d6f' : '#c0392b'; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(x, area.top); ctx.lineTo(x, area.bottom); ctx.stroke(); ctx.fillStyle = ctx.strokeStyle;
    ctx.fillText(mk.label, Math.min(x + 4, area.right - 110), area.top + 12 + 12 * i); ctx.restore(); });
} };
function timeChart(canvasId, data) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') { return; }
  new Chart(el, { type: 'line', plugins: [markerPlugin], data: { labels: data.labels, datasets: data.series.map(function (s, i) {
      return { label: s.label, data: s.values, borderColor: COLORS[[5, 1, 0][i % 3]], borderWidth: 1.2, pointRadius: 0 }; }) },
    options: { maintainAspectRatio: false, animation: { duration: 700 }, interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 8 } } }, plugins: { markers: { list: data.markers } } } });
}
</script>
</body>
</html>
