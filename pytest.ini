[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    core: core engine tests
    hardware: tests related to hardware concurrency and caching
    
testpaths =
    tests
    
python_files = test_*.py
python_classes = Test*
python_functions = test_*

pythonpath = .
addopts = --strict-markers -v
